  <div class="note intro" data-only="nikkei">
    <p>트라이팟 플레이버 여섯과 QQQ, TQQQ 단순 보유를 같은 세금 가정으로 비교한다. 자료는 나스닥100이 1988년부터 닛케이225와 똑같이 움직였다고 가정한 가상의 주가다. 지수 값도 닛케이225를 그대로 쓰고, QQQ와 TQQQ도 이 가상 지수를 따른다고 놓았다.</p>
    <p>닛케이225는 1989년 말의 고점을 34년 뒤인 2024년에야 되찾았다. 그 사이 긴 침체와 여러 번의 폭락이 있었고, 그 뒤로는 크게 올랐다. 이 탭은 긴 침체장을 지날 때 같은 규칙이 어떤 결과를 내는지 보여 준다.</p>
    <p>플레이버의 파라미터는 주로 미국장의 흐름을 보고 고른 값이다. 성격이 다른 시장에 같은 파라미터를 그대로 적용했으므로, 이 탭의 성과는 그 자체로 플레이버를 낮게 평가하는 쪽으로 기운다.</p>
